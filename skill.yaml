name: vulcan-work
version: 0.1.0
help:
  main:
    description: Choose when and how to inspect, edit, create, or render local PDF, XLSX, DOCX, and PPTX files.
    file: help/help.md
  topics:
    - name: pdf
      description: Inspect PDF pages and form values, extract text or run OCR, and merge pages or fill a form in a copy.
      file: help/pdf.md
    - name: xlsx
      description: Find worksheets, read cells and saved formula results, or create and edit an Excel workbook copy.
      file: help/xlsx.md
    - name: docx
      description: Read Word body blocks and review comments, create documents, append paragraphs, or edit precise text in a copy.
      file: help/docx.md
    - name: pptx
      description: Read slide text and speaker notes, create or edit slides, or render a PDF preview.
      file: help/pptx.md
entries:
  - name: pdf-inspect
    description: Get page counts and AcroForm field metadata from a local, unencrypted PDF. Set include_values to read stored field values.
    lua_entry: runtime/pdf-inspect.lua
    lua_module: pdf_inspect
    help: pdf
    input_schema_file: schemas/pdf-inspect.input.schema.json
  - name: pdf-extract-text
    description: Extract bounded text for a range of one to ten pages from a local, unencrypted PDF. Scans require OCR.
    lua_entry: runtime/pdf-extract-text.lua
    lua_module: pdf_extract_text
    help: pdf
    input_schema_file: schemas/pdf-extract-text.input.schema.json
  - name: xlsx-list-sheets
    description: List worksheets, including hidden worksheets, in a local XLSX workbook.
    lua_entry: runtime/xlsx-list-sheets.lua
    lua_module: xlsx_list_sheets
    help: xlsx
    input_schema_file: schemas/xlsx-list-sheets.input.schema.json
  - name: xlsx-read-range
    description: Read up to 100 cells in a local XLSX worksheet. Return formulas and saved results separately without recalculating.
    lua_entry: runtime/xlsx-read-range.lua
    lua_module: xlsx_read_range
    help: xlsx
    input_schema_file: schemas/xlsx-read-range.input.schema.json
  - name: docx-read-blocks
    description: Read main-body Word paragraphs and tables in document order, with paragraph style IDs and comment references.
    lua_entry: runtime/docx-read-blocks.lua
    lua_module: docx_read_blocks
    help: docx
    input_schema_file: schemas/docx-read-blocks.input.schema.json
  - name: docx-list-comments
    description: Read embedded Word comments with their IDs, authors, dates, and text.
    lua_entry: runtime/docx-list-comments.lua
    lua_module: docx_list_comments
    help: docx
    input_schema_file: schemas/docx-list-comments.input.schema.json
  - name: pptx-extract-text
    description: Extract stored text from a range of PowerPoint slides in presentation order, including grouped shapes, tables, and optional speaker notes.
    lua_entry: runtime/pptx-extract-text.lua
    lua_module: pptx_extract_text
    help: pptx
    input_schema_file: schemas/pptx-extract-text.input.schema.json
  - name: pdf-compose
    description: Write a new PDF by joining ordered files or selected page ranges.
    lua_entry: runtime/pdf-compose.lua
    lua_module: pdf_compose
    help: pdf
    input_schema_file: schemas/pdf-compose.input.schema.json
  - name: xlsx-write-cells
    description: Write literal values or explicit formulas to a new Excel workbook or workbook copy.
    lua_entry: runtime/xlsx-write-cells.lua
    lua_module: xlsx_write_cells
    help: xlsx
    input_schema_file: schemas/xlsx-write-cells.input.schema.json
  - name: docx-append-paragraphs
    description: Write paragraphs or headings to a new Word document or an appended copy.
    lua_entry: runtime/docx-append-paragraphs.lua
    lua_module: docx_append_paragraphs
    help: docx
    input_schema_file: schemas/docx-append-paragraphs.input.schema.json
  - name: pptx-replace-text
    description: Replace an exact number of text matches on one slide and write a new PowerPoint copy.
    lua_entry: runtime/pptx-replace-text.lua
    lua_module: pptx_replace_text
    help: pptx
    input_schema_file: schemas/pptx-replace-text.input.schema.json
  - name: pdf-fill-form
    description: Write values to declared AcroForm fields in a new PDF copy.
    lua_entry: runtime/pdf-fill-form.lua
    lua_module: pdf_fill_form
    help: pdf
    input_schema_file: schemas/pdf-fill-form.input.schema.json
  - name: pdf-ocr-pages
    description: Recognize rasterized PDF pages and return text with continuation offsets.
    lua_entry: runtime/pdf-ocr-pages.lua
    lua_module: pdf_ocr_pages
    help: pdf
    input_schema_file: schemas/pdf-ocr-pages.input.schema.json
  - name: docx-replace-text
    description: Replace exact text in a specified Word paragraph or table cell and write a copy.
    lua_entry: runtime/docx-replace-text.lua
    lua_module: docx_replace_text
    help: docx
    input_schema_file: schemas/docx-replace-text.input.schema.json
  - name: pptx-create
    description: Create a new PowerPoint presentation from editable slide titles and body paragraphs.
    lua_entry: runtime/pptx-create.lua
    lua_module: pptx_create
    help: pptx
    input_schema_file: schemas/pptx-create.input.schema.json
  - name: pptx-append-slides
    description: Append editable slides to a copy of an existing PowerPoint presentation.
    lua_entry: runtime/pptx-append-slides.lua
    lua_module: pptx_append_slides
    help: pptx
    input_schema_file: schemas/pptx-append-slides.input.schema.json
  - name: pptx-remove-slides
    description: Remove selected slides and write a new PowerPoint copy with at least one slide.
    lua_entry: runtime/pptx-remove-slides.lua
    lua_module: pptx_remove_slides
    help: pptx
    input_schema_file: schemas/pptx-remove-slides.input.schema.json
  - name: pptx-export-preview
    description: Render a PowerPoint presentation and write a PDF preview.
    lua_entry: runtime/pptx-export-preview.lua
    lua_module: pptx_export_preview
    help: pptx
    input_schema_file: schemas/pptx-export-preview.input.schema.json
