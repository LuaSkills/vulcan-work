name: Release Vulcan Work

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and package Vulcan Work
        id: package
        uses: LuaSkills/luaskills-debug@v0.8.1
        with:
          layout: standard
          expect-tag: ${{ github.ref_name }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.package.outputs.out-dir }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$OUT_DIR"/*
